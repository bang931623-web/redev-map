function hc(mode,v,sc){if(v==null)return '#bdbdb8';if(mode==='chg'){const t=Math.max(-1,Math.min(1,v/sc)),a=Math.abs(t);return `hsl(${t>=0?8:214} ${Math.round(25+55*a)}% ${Math.round(88-38*a)}%)`}const t=Math.max(0,Math.min(1,(v-sc[0])/(sc[1]-sc[0])));return `hsl(28 ${Math.round(30+50*t)}% ${Math.round(90-45*t)}%)`}
/* 동 집계 */
const G={};DATA.rows.forEach(r=>{if(!r.dn)return;const k=r.gu+'|'+r.dn;(G[k]=G[k]||{gu:r.gu,dn:r.dn,rs:[]}).rs.push(r)});
const DG=Object.values(G).map(d=>{d.x=d.rs.reduce((a,r)=>a+r.x,0)/d.rs.length;d.y=d.rs.reduce((a,r)=>a+r.y,0)/d.rs.length;d.lvl=med(d.rs.map(r=>r.lp));const c=d.rs.filter(r=>r.lp!=null&&r.b>0).map(r=>r.lp/r.b-1);d.chg=c.length?med(c):null;return d}).filter(d=>d.lvl!=null);
const hasChg=DG.some(d=>d.chg!=null&&d.chg!==0);let metric=hasChg?'chg':'lvl',mode='p';
const abs=DG.filter(d=>d.chg!=null).map(d=>Math.abs(d.chg)).sort((a,b)=>a-b);const SCc=Math.max(.03,abs[Math.floor(abs.length*.9)]||.03);
const lv=DG.map(d=>d.lvl).sort((a,b)=>a-b);const SCl=[lv[Math.floor(lv.length*.1)],lv[Math.floor(lv.length*.9)]];
let map,iw,mk=[],ov=[];
function side(html){document.getElementById('list').innerHTML=html}
function legend(){const L=document.getElementById('leg');if(mode==='p'){L.innerHTML=Object.keys(KC).filter(k=>DATA.rows.some(r=>r.k===k)).map(k=>`<i style="background:${KC[k]}"></i>${k}`).join('');return}
 L.innerHTML=metric==='chg'?`<i style="background:${hc('chg',-SCc,SCc)}"></i>하락<i style="background:${hc('chg',0,SCc)}"></i>보합<i style="background:${hc('chg',SCc,SCc)}"></i>상승 (${DATA.base} 대비)`:`<i style="background:${hc('lvl',SCl[0],SCl)}"></i>낮음<i style="background:${hc('lvl',SCl[1],SCl)}"></i>높음 (대지평당가 중앙값)`}
function clear(){LB.forEach(m=>m.setMap(null));LB=[];mk.forEach(m=>m.setMap(null));ov.forEach(m=>m.setMap(null));mk=[];ov=[]}
function info(r){return `<div class="iw"><b>${esc(r.n)}</b> <span style="color:#666">${esc(r.k)}</span><br>${esc(r.gu)} ${esc(r.dn)} · ${esc(r.st)}<br>조합원 ${r.own!=null?r.own.toLocaleString('ko-KR')+'명':'확인 필요'}<br>대지평당가 ${fL(r.lp)}${r.b>0&&r.lp!=null?' ('+fC(r.lp/r.b-1)+')':''}<br>최저 매물 ${r.lm!=null?r.lm+'억~':'-'}${r.lc!=null?' · '+r.lc+'건':''}</div>`}


let LB=[];function ctr(r){if(r.pg){let a=1e9,b=-1e9,c=1e9,d=-1e9;r.pg.forEach(g=>g.forEach(p=>{a=Math.min(a,p[0]);b=Math.max(b,p[0]);c=Math.min(c,p[1]);d=Math.max(d,p[1])}));return [(a+b)/2,(c+d)/2]}return [r.x,r.y]}
function lbl(r,me){const col=KC[r.k]||'#777',c=ctr(r);const m=new naver.maps.Marker({position:new naver.maps.LatLng(c[1],c[0]),map,clickable:false,zIndex:me?90:10,icon:{content:`<div class="lw"><div class="lb${me?' me':''}" style="background:${col}">${esc(r.k)} ${esc(r.n)}</div><div class="lb2" style="color:${col};border-color:${col}">${esc(String(r.st).split('(')[0])}${r.pg?'':'<span style="color:#888;font-weight:400"> · 추정 범위(면적 기준)</span>'}</div></div>`,anchor:new naver.maps.Point(0,0)}});LB.push(m);return m}
function lblZoom(){const on=!!QID||map.getZoom()>=14;LB.forEach(m=>m.setMap(on?map:null))}
function poly(r,me){const col=KC[r.k]||'#777';if(!r.pg){if(!r.lp)return;const C=new naver.maps.Circle({map,center:new naver.maps.LatLng(r.y,r.x),radius:Math.sqrt(r.lp/Math.PI),fillColor:col,fillOpacity:me?.45:.35,strokeColor:me?'#e11':col,strokeWeight:3,strokeOpacity:.9,strokeStyle:'shortdash',zIndex:me?5:2});ov.push(C);return}const P=new naver.maps.Polygon({map,paths:r.pg.map(g=>g.map(c=>new naver.maps.LatLng(c[1],c[0]))),fillColor:col,fillOpacity:me?.6:.42,strokeColor:me?'#e11':col,strokeWeight:me?4:2.5,strokeOpacity:1,zIndex:me?5:2});
 naver.maps.Event.addListener(P,'click',()=>{iw.setContent(info(r));iw.setPosition(new naver.maps.LatLng(r.y,r.x));iw.open(map)});ov.push(P)}
function drawP(){clear();legend();const ps=DATA.rows;ps.forEach(r=>{poly(r,false);lbl(r,false)});lblZoom();
 ps.forEach(r=>{const m=new naver.maps.Marker({position:new naver.maps.LatLng(r.y,r.x),map,title:r.n,icon:{content:`<div class="dot" style="background:${KC[r.k]||'#777'}"></div>`,anchor:new naver.maps.Point(8,8)}});
  naver.maps.Event.addListener(m,'click',()=>{iw.setContent(info(r));iw.open(map,m)});mk.push(m);r.m=m});
 side(`<div id="hint">${ps.length}곳 · 점을 누르면 정보가 열립니다. 목록은 이름을 눌러 이동하세요.</div>`+ps.slice().sort((a,b)=>a.gu.localeCompare(b.gu,'ko')||a.n.localeCompare(b.n,'ko')).map(r=>`<div class="it" data-i="${esc(r.id)}"><b>${esc(r.n)}</b><small>${esc(r.gu)} ${esc(r.dn)} · ${esc(r.k)} · ${esc(r.st)}</small></div>`).join(''));
 document.querySelectorAll('.it').forEach(e=>e.onclick=()=>{const r=DATA.rows.find(x=>x.id===e.dataset.i);map.setCenter(new naver.maps.LatLng(r.y,r.x));map.setZoom(16);iw.setContent(info(r));iw.open(map,r.m)})}
function drawH(){clear();legend();iw.close();
 DG.forEach(d=>{const col=hc(metric,metric==='chg'?d.chg:d.lvl,metric==='chg'?SCc:SCl);
  const c=new naver.maps.Circle({map,center:new naver.maps.LatLng(d.y,d.x),radius:420,strokeColor:'#555',strokeOpacity:.5,strokeWeight:1,fillColor:col,fillOpacity:.72});
  const t=new naver.maps.Marker({position:new naver.maps.LatLng(d.y,d.x),map,clickable:false,icon:{content:`<div class="dl">${esc(d.dn)}<br>${metric==='chg'?fC(d.chg):fL(d.lvl)}</div>`,anchor:new naver.maps.Point(0,10)}});
  naver.maps.Event.addListener(c,'click',()=>sel(d));ov.push(c);mk.push(t)});
 side('<div id="hint">동 원을 누르면 그 동의 사업지가 여기에 나옵니다. 값 = 그 동 사업지 대지평당가(매물) 중앙값, 변화 = 같은 사업지의 기준 시점 대비.</div>')}
function sel(d){const ps=d.rs.slice().sort((a,b)=>(b.lp||0)-(a.lp||0));
 side(`<div id="hint"><b style="color:inherit">${esc(d.gu)} ${esc(d.dn)}</b> · ${ps.length}곳 · 중앙값 ${fL(d.lvl)} · ${fC(d.chg)}</div>`+ps.map(r=>`<div class="it" data-i="${esc(r.id)}"><b>${esc(r.n)}</b><small>${esc(r.k)} · ${esc(r.st)} · 대지평당가 ${fL(r.lp)}${r.b>0&&r.lp!=null?' ('+fC(r.lp/r.b-1)+')':''} · 최저 ${r.lm!=null?r.lm+'억~':'-'}</small></div>`).join(''));
 map.setCenter(new naver.maps.LatLng(d.y,d.x));if(map.getZoom()<14)map.setZoom(14);
 document.querySelectorAll('.it').forEach(e=>e.onclick=()=>{const r=DATA.rows.find(x=>x.id===e.dataset.i);map.setCenter(new naver.maps.LatLng(r.y,r.x));map.setZoom(16);iw.setContent(info(r));iw.open(map,new naver.maps.LatLng(r.y,r.x))})}

/* 상세 분석 삽입용: ?id=사업지ID&r=반경km&embed=1 */
const QP=new URLSearchParams(location.hash.slice(1)||location.search),QID=QP.get('id'),QR=Math.max(.3,Math.min(5,+QP.get('r')||1.5));
function kmd(a,b){const R=6371,t=Math.PI/180,dy=(b.y-a.y)*t,dx=(b.x-a.x)*t*Math.cos((a.y+b.y)/2*t);return R*Math.sqrt(dx*dx+dy*dy)}
function drawF(c){clear();legend();iw.close();const near=DATA.rows.filter(r=>r.id===c.id||kmd(c,r)<=QR);
 const C=new naver.maps.Circle({map,center:new naver.maps.LatLng(c.y,c.x),radius:QR*1000,strokeColor:'#e11',strokeOpacity:.6,strokeWeight:1,strokeStyle:'dash',fillColor:'#e11',fillOpacity:.04,clickable:false});ov.push(C);
 near.forEach(r=>{const me=r.id===c.id;poly(r,me);lbl(r,me);const m=new naver.maps.Marker({position:new naver.maps.LatLng(r.y,r.x),map,title:r.n,zIndex:me?99:1,icon:{content:`<div class="dot${me?' sel':''}${(!r.pg&&r.lp)?' sm':''}" style="background:${KC[r.k]||'#777'}"></div>`,anchor:(!r.pg&&r.lp)?new naver.maps.Point(4,4):new naver.maps.Point(me?12:8,me?12:8)}});
  naver.maps.Event.addListener(m,'click',()=>{iw.setContent(info(r));iw.open(map,m)});mk.push(m);r.m=m});lblZoom();
 map.setSize(new naver.maps.Size(window.innerWidth,window.innerHeight));map.setCenter(new naver.maps.LatLng(c.y,c.x));map.setZoom(QR<=1?15:QR<=1.5?14:13);if(QP.get('cap')){naver.maps.Event.once(map,'tilesloaded',()=>setTimeout(()=>{window.__done=1},1200))}else setTimeout(()=>{const r=DATA.rows.find(x=>x.id===c.id);iw.setContent(info(r));iw.open(map,r.m)},400);
 document.getElementById('leg').innerHTML+=` · 반경 ${QR}km 안 ${near.length-1}곳`}
function setMode(m){mode=m;document.getElementById('m-p').className=m==='p'?'on':'';document.getElementById('m-h').className=m==='h'?'on':'';document.getElementById('mm').style.display=m==='h'&&hasChg?'flex':'none';m==='p'?drawP():drawH()}
window.navermap_authFailure=function(){document.getElementById('ou').textContent=location.origin;document.getElementById('err').style.display='block'};
function init(){if(!window.naver||!naver.maps){navermap_authFailure();return}
 map=new naver.maps.Map('map',{center:new naver.maps.LatLng(37.5565,126.98),zoom:11,mapDataControl:false});iw=new naver.maps.InfoWindow({borderWidth:1});naver.maps.Event.addListener(map,'zoom_changed',()=>{if(typeof lblZoom==='function')lblZoom()});
 document.getElementById('m-p').onclick=()=>setMode('p');document.getElementById('m-h').onclick=()=>setMode('h');
 document.getElementById('c-chg').onclick=()=>{metric='chg';document.getElementById('c-chg').className='on';document.getElementById('c-lvl').className='';drawH()};
 document.getElementById('c-lvl').onclick=()=>{metric='lvl';document.getElementById('c-lvl').className='on';document.getElementById('c-chg').className='';drawH()};
 const c=QID&&DATA.rows.find(r=>r.id===QID);if(c){if(QP.get('embed')||QP.get('cap')){document.body.classList.add('emb')}drawF(c);return}
 setMode('p')}
window.addEventListener('hashchange',()=>location.reload());window.addEventListener('load',()=>setTimeout(init,200));
</script><script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=fbnoaz9khs" onerror="navermap_authFailure()"></script></body></html>
